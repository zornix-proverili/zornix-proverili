name: Auto Commit
on:
  schedule:
    - cron: '0 0,4,8,12 * * 1-5'
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Random Delay
        run: sleep $((RANDOM % 1800))

      - name: Auto Commit
        run: |
          echo "$(date)" >> activity.log
          git config user.name "${{ secrets.GIT_USER_NAME }}"
          git config user.email "${{ secrets.GIT_USER_EMAIL }}"
          git add activity.log
          git commit -m "chore: automated technical activity sync [skip ci]"
          git push
