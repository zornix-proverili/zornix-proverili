name: Auto Commit
on:
  schedule:
    - cron: '0 21,5,8 * * 1-5'
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Auto Commit
        run: |
          git config user.name "${{ secrets.GIT_USER_NAME }}"
          git config user.email "${{ secrets.GIT_USER_EMAIL }}"
          
          COMMIT_COUNT=$((2 + RANDOM % 6))
          
          for i in $(seq 1 $COMMIT_COUNT); do
            echo "$(date)" >> activity.log
            git add activity.log
            git commit -m "chore: auto sync $i [skip ci]"
            sleep 1
          done
          
          git push
